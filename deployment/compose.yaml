# Portable API only. The public frontend is published separately to Arweave.
# TLS must terminate at a configured reverse proxy; port 8787 stays local here.
services:
  sejire-api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    init: true
    env_file: ./sejire.env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - sejire-data:/data
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  sejire-data:
