name: Quick Tumalas API probe

on:
  push:
    branches:
      - research/tumalas-mobi-extract
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/tumalas-quick-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tumalas-quick-probe
          path: tumalas-quick-output
          if-no-files-found: error
          retention-days: 14
