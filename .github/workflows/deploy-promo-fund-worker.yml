name: Deploy promo fund Worker

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to deploy the verified sejire-sponsor configuration'
        required: true
        default: 'NO'
        type: string
  push:
    branches:
      - feat/promo-funded-preservation
    paths:
      - '.github/workflows/deploy-promo-fund-worker.yml'
      - 'apps/sponsor/wrangler.toml'
      - 'apps/sponsor/src/fund/**'
      - 'apps/sponsor/package.json'
      - 'apps/sponsor/tests/fund*.mjs'

# rollout diagnostic: Worker-native signer address derivation
permissions:
  contents: read

concurrency:
  group: deploy-promo-fund-worker
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/promo-funded-preservation' && inputs.confirm == 'DEPLOY') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/sponsor/package-lock.json

      - name: Install sponsor dependencies
        run: npm ci --prefix apps/sponsor

      - name: Install web dependencies for shared envelope and build checks
        run: npm ci --prefix apps/web

      - name: Typecheck sponsor Worker
        run: npm run check --prefix apps/sponsor

      - name: Run promo fund tests
        run: npm run test:fund --prefix apps/sponsor

      - name: Test fund in workerd with persistent SQLite Durable Object
        run: npm run test:fund-runtime

      - name: Check native production build
        run: npm run native:build

      - name: Scan fund browser bundle
        run: npm run security:fund

      - name: Confirm this run is still the feature-branch head
        id: head
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/feat/promo-funded-preservation | awk '{print $1}')"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale Worker deployment: $GITHUB_SHA; current head is $latest"
          fi

      - name: Deploy sejire-sponsor
        if: steps.head.outputs.current == 'true'
        working-directory: apps/sponsor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.47.0 deploy --config wrangler.toml
