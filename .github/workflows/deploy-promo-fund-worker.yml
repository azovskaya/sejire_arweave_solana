name: Deploy promo fund Worker

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY after reviewing the exact source SHA and successful full CI'
        required: true
        default: 'NO'
        type: string
      ci_run_id:
        description: 'Successful SEJIRE checks run for this exact feature-branch SHA (push or manual run)'
        required: true
        type: string
      ci_attempt:
        description: 'Attempt number of that successful CI run'
        required: true
        default: '1'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-promo-fund-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/promo-funded-preservation' && inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_CONFIRM: ${{ inputs.confirm }}
      RELEASE_CI_RUN_ID: ${{ inputs.ci_run_id }}
      RELEASE_CI_ATTEMPT: ${{ inputs.ci_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/sponsor/package-lock.json
            apps/web/package-lock.json

      - name: Require completed full CI for this exact current production-branch SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/worker-release-gate.mjs

      - name: Release gate regressions (offline, no deployment)
        run: node --test scripts/worker-release-gate.test.mjs

      - name: Install sponsor dependencies
        run: npm ci --prefix apps/sponsor

      - name: Install web dependencies for shared envelope and build checks
        run: npm ci --prefix apps/web

      - name: Block release on high or critical production dependency findings
        run: |
          npm audit --prefix apps/web --omit=dev --audit-level=high
          npm audit --prefix apps/sponsor --omit=dev --audit-level=high

      - name: Typecheck sponsor Worker
        run: npm run check --prefix apps/sponsor

      - name: Run promo fund tests
        run: npm run test:fund --prefix apps/sponsor

      - name: Test fund in workerd with persistent SQLite Durable Object
        run: npm run test:fund-runtime

      - name: Test paid SOL orders and shared treasury reservations (synthetic only)
        run: npm run test:paid

      - name: Test paid runtime and persistent automatic continuation (synthetic only)
        run: npm run test:paid-runtime

      - name: Check native production build
        run: npm run native:build

      - name: Scan fund browser bundle
        run: npm run security:fund

      - name: Recheck full CI attempt and branch head immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/worker-release-gate.mjs

      - name: Deploy sejire-sponsor
        working-directory: apps/sponsor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.47.0 deploy --config wrangler.toml
