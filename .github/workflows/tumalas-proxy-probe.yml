name: Probe Tumalas graph API

on:
  push:
    branches:
      - research/tumalas-mobi-extract
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe public and proxy fetch paths
        run: node scripts/tumalas-proxy-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tumalas-proxy-probe
          path: tumalas-proxy-output
          if-no-files-found: error
          retention-days: 14
