name: Promo fund Worker runtime
on:
  push:
    branches: [feat/promo-funded-preservation]
    paths:
      - 'apps/sponsor/src/fund/**'
      - 'apps/sponsor/src/**'
      - 'apps/sponsor/tests/**'
      - 'apps/sponsor/package*.json'
      - 'apps/web/src/lib/crypto/**'
      - 'apps/web/src/lib/solana/policy.ts'
      - 'scripts/build-preview-worker.mjs'
      - '.github/workflows/promo-fund-runtime.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/sponsor/**'
      - 'apps/web/src/lib/crypto/**'
      - 'apps/web/src/lib/solana/policy.ts'
      - 'scripts/build-preview-worker.mjs'
      - '.github/workflows/promo-fund-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rpc-probe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/promo-funded-preservation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/sponsor/package-lock.json
      - run: npm ci --prefix apps/sponsor
      - name: Probe the pinned Solana RPC from an isolated Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p .cache/rpc-probe
          node --input-type=module -e "import { buildWorker } from './apps/sponsor/tests/build-worker.mjs'; await buildWorker('apps/sponsor/tests/rpc-probe-worker.ts', '.cache/rpc-probe/worker.mjs')"
          export PROBE_NAME="sejire-rpc-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > .cache/rpc-probe/wrangler.toml <<EOF
          name = "$PROBE_NAME"
          main = "worker.mjs"
          compatibility_date = "2026-07-01"
          compatibility_flags = ["nodejs_compat"]
          [triggers]
          crons = ["* * * * *"]
          EOF
          cleanup() {
            if test -n "${tail_pid:-}"; then kill "$tail_pid" 2>/dev/null || true; fi
            python3 - <<'PY'
          import os,urllib.request
          name=os.environ['PROBE_NAME']
          assert name.startswith('sejire-rpc-probe-') and os.environ['GITHUB_RUN_ID'] in name
          url='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/workers/scripts/'+name
          request=urllib.request.Request(url,method='DELETE',headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(request,timeout=20) as response: print('Disposable probe deletion HTTP',response.status)
          PY
          }
          trap cleanup EXIT
          npx --yes wrangler@4.47.0 deploy --config .cache/rpc-probe/wrangler.toml
          npx --yes wrangler@4.47.0 tail "$PROBE_NAME" --format pretty > .cache/rpc-probe/tail.log 2>&1 &
          tail_pid=$!
          python3 - <<'PY'
          import pathlib,time
          path=pathlib.Path('.cache/rpc-probe/tail.log')
          # New Cloudflare Cron Triggers can take up to 15 minutes to propagate.
          for attempt in range(210):
            if path.exists():
              for line in path.read_text(errors='replace').splitlines():
                if 'rpc_probe_result ' in line:
                  print('rpc_probe_result',line.split('rpc_probe_result ',1)[1][:4000])
                  raise SystemExit(0)
            time.sleep(5)
          print('tail_result_missing; tail_status_lines:')
          for line in path.read_text(errors='replace').splitlines()[-8:]:
            print(line[:300].split('https://',1)[0])
          raise SystemExit(1)
          PY
  fund-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/sponsor/package-lock.json
            apps/web/package-lock.json
      - run: npm ci --prefix apps/sponsor
      - run: npm ci --prefix apps/web
      - run: npm run check --prefix apps/sponsor
      - run: npm run preview:package
      - name: Build production Worker candidate from fund source
        run: |
          mkdir -p .cache/fund-worker
          node --input-type=module -e "import { buildWorker } from './apps/sponsor/tests/build-worker.mjs'; await buildWorker('apps/sponsor/src/index.ts', '.cache/fund-worker/worker.mjs')"
      - name: Real workerd HTTP acceptance with mock provider and persistent SQLite DO
        run: npm run test:fund-runtime
      - run: npm run test:fund
      - run: npm run native:build
      - run: npm run security:fund
      - uses: actions/upload-artifact@v4
        with:
          name: fund-worker-candidate
          path: .cache/fund-worker/worker.mjs
