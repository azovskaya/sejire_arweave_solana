name: SEJIRE native info diagnostic
on:
  push:
    branches: [diagnose/native-info-20261123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: github.ref == 'refs/heads/diagnose/native-info-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose public native info response without following redirects
        run: node scripts/diagnose-native-info.mjs
