name: SEJIRE checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, feat/solana-preservation, feat/preservation-v2-simple, feat/promo-funded-preservation, fix/restore-direct-data, feat/decentralized-arweave-20261116, feat/funded-portable-release-20261125, feat/arweave-only-protocol-20261127]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/sponsor/package-lock.json
      - name: Worker release gate regressions (offline, no deployment)
        run: node --test scripts/worker-release-gate.test.mjs
      - run: npm ci --prefix apps/web
      - run: npm ci --prefix apps/sponsor
      - run: npm test
      - name: Stress-test family tree and шежіре PDF exports
        working-directory: apps/web
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          python3 -m venv "$RUNNER_TEMP/sejire-pdf-env"
          "$RUNNER_TEMP/sejire-pdf-env/bin/pip" install PyMuPDF==1.26.6
          node scripts/export-layout-stress.mjs "$RUNNER_TEMP/sejire-layout" --boundaries
          "$RUNNER_TEMP/sejire-pdf-env/bin/python" scripts/check-layout-pdfs.py "$RUNNER_TEMP/sejire-layout"
      - run: npm run check --prefix apps/sponsor
      - run: npm run test:fund-runtime
      - name: Paid SOL archive, durable continuation and mainnet adapters (synthetic network)
        run: npm run test:paid-runtime
      - name: Linux checkout adapter, SQLite writer and idempotent order (synthetic network)
        run: npm run test:linux --prefix apps/sponsor
      - name: Portable release, bounded production preflight and online backup regressions (synthetic)
        run: npm run test:portable-release && npm run test:linux-package
      - name: Production Docker image with persistent SQLite, no network and disabled admissions
        run: npm run portable:service:docker-test
      - run: npm run test:checkout
      - run: npm run test:rpc
      - run: npm run test:sqlite
      - run: npm run test:api
      - run: npm run test:protocol
      - name: AO readiness signer selftest (offline, no secrets or network)
        run: node scripts/ao-live-readiness.mjs --selftest
      - name: Local Lua boundary checks (not a live AO process)
        timeout-minutes: 4
        run: |
          if ! command -v lua5.4 >/dev/null; then
            sudo apt-get update -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
            sudo apt-get install -y lua5.4
          fi
          lua5.4 ao/modules/local_checks.lua
      - run: npm run test:preservation
      - run: npm run lint --prefix apps/web
      - run: npm run archive:measure
      - run: npm run solana:build
      - run: npm run checkout:build
      - run: npm exec --prefix apps/web -- playwright install --with-deps chromium firefox webkit
      - name: Offline recovery format, standalone decoder and current-envelope compatibility
        run: npm run test:offline-recovery
      - name: Direct Arweave signing, exact resume and chunk delivery (synthetic network)
        run: npm run test:direct --prefix apps/web
      - name: Read-only direct Arweave API and CORS readiness
        timeout-minutes: 2
        run: |
          node --import ./apps/web/node_modules/tsx/dist/loader.mjs --test scripts/verify-direct-network.test.mts
          node --import ./apps/web/node_modules/tsx/dist/loader.mjs scripts/verify-direct-network.mts
      - name: Preserve direct Arweave API readiness evidence (read-only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-arweave-api-readiness
          path: .cache/direct-network/readiness.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Historical native archives retain signature, Merkle and encryption verification
        run: npm run test:historical-native --prefix apps/web
      - name: Independent recovery kit, complete local vault and legacy journal boundary
        run: npm run test:independent-unit --prefix apps/web
      - name: Build public Arweave-only application and every emitted chunk boundary
        id: independent_build
        run: npm run web:build && npm run arns:verify
      - name: Standalone recovery HTML with OS network isolation in Chromium, Firefox and WebKit (synthetic data)
        timeout-minutes: 5
        run: |
          SEJIRE_TEST_NODE="$(command -v node)"
          sudo -H env PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" \
            SEJIRE_TEST_OS_OFFLINE=1 \
            unshare --net "$SEJIRE_TEST_NODE" --test tools/recovery/browser.test.mjs
      - name: Independent static app in Chromium, Firefox and WebKit (synthetic network)
        # Independent of standalone recovery: collect both outcomes. Any failed
        # step still fails this job and prevents release-pack preparation.
        if: ${{ !cancelled() && steps.independent_build.outcome == 'success' }}
        run: npm run test:independent-browser
      - name: Preserve independent desktop and mobile screens (synthetic family, no recovery words)
        uses: actions/upload-artifact@v4
        with:
          name: independent-static-screens
          path: apps/web/test-results/**/independent-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Prepare independent static pack without upload or payment
        run: npm run permaweb:prepare
      - uses: actions/upload-artifact@v4
        with:
          name: permaweb-static-release
          path: .cache/permaweb-release/
          retention-days: 14
      - name: Build portable SOL Mainnet, promo and server-admin release with offline recovery
        env:
          SEJIRE_FUNDED_API_ORIGIN: https://sejire-api.azovskaya.prod.page
        run: npm run arns:build:portable && npm run arns:verify:portable
      - name: Portable static gateway, server-admin and wrong-network acceptance in three browsers
        env:
          SEJIRE_TEST_API_ORIGIN: https://sejire-api.azovskaya.prod.page
        run: npm run test:portable-browser
      - name: Prepare portable static pack without upload, payment or ArNS change
        run: node scripts/prepare-permaweb.mjs apps/web/dist .cache/permaweb-portable-release
      - uses: actions/upload-artifact@v4
        with:
          name: permaweb-portable-funded-release
          path: .cache/permaweb-portable-release/
          if-no-files-found: error
          retention-days: 14
      - name: Editor safety regressions (synthetic data, no wallets or external writes)
        working-directory: apps/web
        run: npx --no-install playwright test --config playwright.editor.config.ts
      - run: npm run test:checkout-browser
      - run: npm run test:protocol-browser
      - run: VITE_FUND_API_URL=https://sejire-sponsor.azovskaya-alissa.workers.dev npm run native:build
      - run: npm run security:fund
      - name: Verify built static ArNS client and mocked promo completion
        run: npm run arns:verify:funded && npm run test:arns-browser
      - name: Portable admin verifier is copied into the static build
        run: cmp apps/web/public/admin-lock.json apps/web/dist/admin-lock.json
      - name: Pages root publisher and smoke syntax
        run: node --check scripts/pages-native-artifact.mjs && node --check scripts/verify-public-root.mjs
      - name: Native V2 bundle dependency boundary (all dynamic chunks)
        run: node scripts/native-bundle-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: native-security-boundary
          path: .cache/native-security
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: native-admin-build
          path: apps/web/dist/
          retention-days: 14
      - run: npm run test:permaweb-prepare
      - name: Native static publication, durable exact replay and signed AR cap (synthetic network)
        run: npm run test:native-publication
      - name: Wallet history timeout regression (read-only, balance preserved)
        run: npm run test:native-browser --prefix apps/web -- --grep 'public balances never wait for history'
      - run: npm run test:native-browser
      - run: npm run test:native-pilot-browser --prefix apps/web
      - run: npm run test:v2-browser --prefix apps/web
      - run: npm run test:admin-browser --prefix apps/web
      - run: npm run test:v2-recovery-browser --prefix apps/web
      - name: Promo save, reload recovery and automatic editor completion (mocked network)
        run: npm run test:fund-browser --prefix apps/web
      - name: Paid SOL save, cross-method recovery and editor completion (mocked network)
        run: npm run test:paid-browser
      - name: Read-only Arweave recovery gateway and CORS acceptance
        run: |
          if [ "$GITHUB_REF" = 'refs/heads/feat/arweave-only-protocol-20261127' ]; then
            node --import ./apps/web/node_modules/tsx/dist/loader.mjs --test scripts/verify-native-recovery-network.test.mts
            node --import ./apps/web/node_modules/tsx/dist/loader.mjs scripts/verify-native-recovery-network.mts
          else
            node scripts/verify-recovery-network.mjs
          fi
      - name: Preserve native recovery readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-recovery-readiness
          path: .cache/native-recovery-network/readiness.json
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run test:native-journey --prefix apps/web
      - name: Preserve synthetic MVP screens (no recovery words or wallet secrets)
        uses: actions/upload-artifact@v4
        with:
          name: native-mvp-screens
          path: apps/web/test-results/mvp-screens
          if-no-files-found: error
      - name: Read-only live Solana requests from public Pages browser
        if: github.ref != 'refs/heads/feat/arweave-only-protocol-20261127'
        run: node scripts/verify-public-sol-balances.mjs
      - name: Preserve legacy public Solana read diagnostics
        if: github.ref != 'refs/heads/feat/arweave-only-protocol-20261127'
        uses: actions/upload-artifact@v4
        with:
          name: public-sol-read-diagnostics
          path: .cache/public-sol-read/
      - run: npm run continuation:package
      - run: npm run test:continuation
      - uses: actions/upload-artifact@v4
        with:
          name: sejire-continuation-local-pilot
          path: .cache/continuation/
          retention-days: 14
      - run: npm run preview:package
      - name: Preserve preview build for owner review (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: devnet-preview-build
          path: |
            .cache/devnet-preview/
            apps/web/dist/
          retention-days: 7
      - run: npm run security:reachability
      - name: Preserve static security evidence (no site publication)
        uses: actions/upload-artifact@v4
        with:
          name: a2-1-security-evidence
          path: .cache/a2-1/browser-dependency-reachability.json
          retention-days: 14
      - name: Web production dependency audit (blocking high and critical)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .cache/dependency-audit
          npm audit --prefix apps/web --omit=dev --audit-level=high --json | tee .cache/dependency-audit/web-production.json
      - name: Web build-tool dependency audit (non-blocking; release review required)
        if: always()
        continue-on-error: true
        run: npm audit --prefix apps/web --json | tee .cache/dependency-audit/web-full.json
      - name: Sponsor production dependency audit (blocking high and critical)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm audit --prefix apps/sponsor --omit=dev --audit-level=high --json | tee .cache/dependency-audit/sponsor-production.json
      - name: Sponsor test-tool dependency audit (non-blocking; release review required)
        if: always()
        continue-on-error: true
        run: npm audit --prefix apps/sponsor --json | tee .cache/dependency-audit/sponsor-full.json
      - name: Preserve complete dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-evidence
          path: .cache/dependency-audit/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve checkout failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-failure-diagnostics
          path: apps/web/test-results/
