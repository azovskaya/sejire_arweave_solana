name: SEJIRE checks
on:
  pull_request:
  push:
    branches: [main, feat/solana-preservation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/sponsor/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm ci --prefix apps/sponsor
      - run: npm test
      - run: npm run check --prefix apps/sponsor
      - run: npm run test:checkout
      - run: npm run test:rpc
      - run: npm run test:sqlite
      - run: npm run test:api
      - run: npm run test:protocol
      - name: AO readiness signer selftest (offline, no secrets or network)
        run: node scripts/ao-live-readiness.mjs --selftest
      - name: Local Lua boundary checks (not a live AO process)
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          lua5.4 ao/modules/local_checks.lua
      - run: npm run test:preservation
      - run: npm run lint --prefix apps/web
      - run: npm run archive:measure
      - run: npm run solana:build
      - run: npm run checkout:build
      - run: npm exec --prefix apps/web -- playwright install --with-deps chromium
      - run: npm run test:checkout-browser
      - run: npm run test:protocol-browser
      - name: Native bundle dependency boundary (all dynamic chunks)
        run: node scripts/native-bundle-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: native-security-boundary
          path: .cache/native-security
          include-hidden-files: true
      - run: npm run native:build
      - uses: actions/upload-artifact@v4
        with:
          name: native-admin-build
          path: apps/web/dist/
          retention-days: 14
      - run: npm run test:native-browser
      - run: npm run test:native-pilot-browser --prefix apps/web
      - name: Read-only live Solana requests from public Pages browser
        run: node scripts/verify-public-sol-balances.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: public-sol-read-diagnostics
          path: .cache/public-sol-read/
      - run: npm run continuation:package
      - run: npm run test:continuation
      - uses: actions/upload-artifact@v4
        with:
          name: sejire-continuation-local-pilot
          path: .cache/continuation/
          retention-days: 14
      - run: npm run preview:package
      - name: Preserve preview build for owner review (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: devnet-preview-build
          path: |
            .cache/devnet-preview/
            apps/web/dist/
          retention-days: 7
      - run: npm run security:reachability
      - name: Preserve static security evidence (no site publication)
        uses: actions/upload-artifact@v4
        with:
          name: a2-1-security-evidence
          path: .cache/a2-1/browser-dependency-reachability.json
          retention-days: 14
      - name: Web dependency audit (non-blocking; release review required)
        continue-on-error: true
        run: npm audit --prefix apps/web --omit=dev
      - name: Sponsor dependency audit (non-blocking; release review required)
        continue-on-error: true
        run: npm audit --prefix apps/sponsor --omit=dev
      - name: Sponsor test-tool dependency audit (non-blocking; release review required)
        continue-on-error: true
        run: npm audit --prefix apps/sponsor
      - name: Preserve checkout failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-failure-diagnostics
          path: apps/web/test-results/
