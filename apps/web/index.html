<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // A path-manifest fallback may serve this page below an unknown path.
      // Resolve its relative assets from the ArNS root or original manifest,
      // while leaving GitHub Pages and local deployment subdirectories intact.
      (() => {
        const host = location.hostname.toLowerCase();
        const gateways = ['ar.io', 'arweave.net', 'arweave.io', 'arweave.dev', 'turbo-gateway.com'];
        const gateway = gateways.find(value => host === value || host.endsWith('.' + value));
        const subdomain = gateway && host !== gateway ? host.slice(0, -gateway.length - 1) : '';
        // Gateway sandbox redirects keep the manifest ID in the URL path.
        // An ArNS name still resolves from its root even if a deep path looks
        // like a transaction ID. Sandbox labels are the 52-character base32 ID.
        const namedOrigin = subdomain && !/^[a-z2-7]{52}$/.test(subdomain);
        const manifest = !namedOrigin && /^\/([A-Za-z0-9_-]{43})(?:\/|$)/.exec(location.pathname);
        if (!manifest && !gateway) return;
        const base = document.createElement('base');
        base.setAttribute('href', manifest ? '/' + manifest[1] + '/' : '/');
        document.head.appendChild(base);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SEJIRE — Keep your family history</title>
    <meta
      name="description"
      content="Build your family tree. Preserve an encrypted archive with your own recovery words."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
