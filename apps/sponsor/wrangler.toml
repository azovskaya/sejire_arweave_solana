name = "sejire-sponsor"
main = "src/configuredEntry.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[vars]
PAYMENT_PROVIDER = "mock"
FUND_API_ENABLED = "true"
# Paid mainnet orders use the existing Fund Admin recipient settings. Do not put
# recipient addresses here: missing settings make new offers fail closed.
CHECKOUT_PAID_ENABLED = "true"
CHECKOUT_PAID_EXECUTION_ENABLED = "true"
CHECKOUT_CONTRIBUTION_ENABLED = "true"
CHECKOUT_PAID_NETWORK = "mainnet-beta"
# Server-only paid Solana RPC endpoint with provider authorization belongs in
# Worker secret CHECKOUT_SOLANA_RPC_URL, never in this file or the web bundle.
# Optional JSON array CHECKOUT_SOLANA_RPC_URLS can add up to four more server
# endpoints (including self-hosted RPC/PATH); keep credentialed URLs as secrets.
# Paid Mainnet also tries Pocket's public portal, then the Solana public RPC.
# configuredEntry replaces this fallback with admin-sol-recipients-<revision>
# whenever the saved Fund Admin settings are present.
CHECKOUT_PAID_POLICY_VERSION = "admin-sol-recipients-1"
CHECKOUT_PAID_TREASURY_ADDRESS = "qgoIFw9WsusMRapWzcFg4jNW08HSWvQkpAKOz86BUuI"
CHECKOUT_PAID_AR_BUDGET_ID = "paid-mainnet-v1"
CHECKOUT_PAID_AR_BUDGET_WINSTON = "1000000000000"
CHECKOUT_PAID_MAX_REWARD_WINSTON = "10000000000"
CHECKOUT_ALLOWED_ORIGINS = "https://azovskaya.github.io,https://sejire.ar.io"
PUBLISH_PRICE_MINOR = "1500"
PUBLISH_CURRENCY = "KZT"
MAX_ENVELOPE_BYTES = "524288"
# Comma-separated; include local Vite when developing
APP_ORIGIN = "https://azovskaya.github.io,https://sejire.ar.io,http://localhost:5173,http://127.0.0.1:5173"
# Optional live Kaspi (defaults in Worker if unset):
# KASPI_API_BASE = "https://pay.kaspi.kz/api/v2"
# KASPI_TRADE_POINT_ID = "from-kaspi-cabinet"

# Legacy cashier keys and Kaspi settings can be entered at /admin after deploy.
# Promo Fund ARWEAVE_TREASURY_JWK and PROMO_CODE_SECRET must be Worker secrets;
# never enter them in the legacy /admin key form or commit their values.
# Optional claim-guard for the first visit:
# SETUP_PIN = "only-for-first-setup"

# Legacy wrangler secrets still work as fallback (do not commit):
#   npx wrangler secret put KASPI_MERCHANT_TOKEN
#   npx wrangler secret put TURBO_JWK
#   npx wrangler secret put ADMIN_TOKEN
# Optional:
#   npx wrangler secret put OPS_SALT
# Public treasury address (safe; also derived from JWK in /admin):
# TREASURY_ADDRESS = "arweave-address-from-treasury-init"

# Required in production so /admin keys survive worker restarts:
# [[kv_namespaces]]
# binding = "IDEMPOTENCY"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
# preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

# Fund and checkout share one atomic SQLite Durable Object.
# Fund API is enabled after owner readiness verification, reconciliation, promo setup and explicit rollout approval.
[[durable_objects.bindings]]
name = "CHECKOUT_LEDGER"
class_name = "CheckoutLedger"

[[migrations]]
tag = "fund-ledger-v1"
new_sqlite_classes = ["CheckoutLedger"]
